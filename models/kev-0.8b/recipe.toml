# Recipe for Kev-0.8B — the configuration that produced the staged bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# The decoder graph is this port's authoring (conversion/kev/qwen3_5_kev_decoder.py: the overlay's stateful Qwen3.5
# text decoder on the merged weights, no vocabulary head, the final-norm hidden state at every position of a static
# 128-token call, each Gated DeltaNet layer's recurrence in the overlay's fp32 Metal chunk kernel). The pointer head runs
# on the host from head/head.safetensors. The exporter reads the merged checkpoint that the author's own
# scripts/merge_lora_checkpoint.py writes; conversion/kev/README.md lists the oracle, the merge and the gates in order.

["kev-0.8b"]
script = "kev/export_decoder.py"
args = ["fp16", "--prefill-chunk", "128", "--gdn-scan", "metal", "--aot"]
card = "README.md"
hf_repo = "mlboydaisuke/Kev-0.8B-CoreAI"
source_hf_id = "jaredpalmer/kev-0.8b"
source_revision = "bf75a6a8848ea6960ff2ed108d9ed44c2941174f"
base = "Qwen/Qwen3.5-0.8B-Base"
base_revision = "dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68"
bundle = "gpu-pipelined/kev_0_8b_decode_fp16_metal_pf128"
status = "verified"
overlay = true
runtime_patches = []
needs = [
  "The author's repository at tag kev-1.0 (github.com/jaredpalmer/kev, commit 6b719c3c3f367295f6ef336f4f751cf5ff970abc) in",
  "$ZOO_WORK_ROOT/_kev/kev-src and its own environment (uv export --frozen of its uv.lock: torch 2.8.0, transformers 5.17.0,",
  "peft 0.21.0, huggingface_hub 1.32.0) for the merge; HF_HOME=$ZOO_WORK_ROOT/_kev/hf with jaredpalmer/kev-0.8b at tag v1.0",
  "(788ddbdd65715bb03a56788c822f6c632c9a551d) and Qwen/Qwen3.5-0.8B-Base at dc7cdfe2 fetched once online by that venv",
  "(huggingface_hub 1.32 resolves a 40-hex revision offline only after an online snapshot_download).",
  "The merged checkpoint: (cd $ZOO_WORK_ROOT/_kev/kev-src && HF_HUB_OFFLINE=1 python scripts/merge_lora_checkpoint.py",
  "--lora jaredpalmer/kev-0.8b@788ddbdd65715bb03a56788c822f6c632c9a551d --out $ZOO_WORK_ROOT/_kev/merged/kev-0.8b-v1.0),",
  "then the local id the exporter reads: $ZOO_WORK_ROOT/_kev/hf/hub/models--kev-local--kev-0.8b-v1.0-merged/snapshots/",
  "ab6bd41853ef/ with symlinks to the merged config.json, model.safetensors, tokenizer.json and tokenizer_config.json, and",
  "refs/main = ab6bd41853ef. The exporter checks model.safetensors' sha256 (b5ebf92a...) before it exports. Run again",
  "on 2026-10-04 the merge wrote the same model.safetensors and head.pt bytes.",
  "The overlay venv (coreai-core 1.0.0b2, coreai-torch 0.4.1, torch 2.9.0, transformers 4.57.6), HF_HUB_OFFLINE=1, and for",
  "--aot Xcode 27.0 RC as DEVELOPER_DIR.",
]
