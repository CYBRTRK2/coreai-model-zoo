  "The source snapshot at 17f0b0ad64efb65d273590632833508766b2aae6 in the Hugging Face cache; the clef_flash scripts",
  "default HF_HOME to $ZOO_WORK_ROOT/_clefflash/hf and set HF_HUB_OFFLINE=1 / HF_HUB_DISABLE_XET=1.",
