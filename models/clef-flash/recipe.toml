# Recipe for clef-flash — the configuration that produced each staged bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# A decision needs one decoder, the head and the lm_head table; an image adds one tower. The decoder and the head
# are this port's authoring (conversion/clef_flash/qwen3_5_clef_decoder.py: ids in, image rows as a static input,
# M-RoPE in the graph, the final-norm hidden state at every position out; clef_head.py: the author's joint schema
# head as matrices). The towers are the overlay's qwen3_5_vision.py through the Qwen3.8-27B vision exporter with the
# grid and the dtype set. conversion/clef_flash/README.md lists the oracle and the gates in order.

["clef-flash"]
script = "clef_flash/export_decoder.py"
args = ["fp16", "--prefill-chunk", "64", "--aot"]
card = "README.md"
hf_repo = "mlboydaisuke/clef-flash-CoreAI"
source_hf_id = "Cloudflare/clef-flash"
source_revision = "17f0b0ad64efb65d273590632833508766b2aae6"
bundle = "gpu-pipelined/clef_flash_decode_fp16_pf64"
status = "verified"
overlay = true
