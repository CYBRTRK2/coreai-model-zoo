# Recipe for Kev-4B — the configuration that produced the staged bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>
#
# The same decoder module as Kev-0.8B (conversion/kev/qwen3_5_kev_decoder.py, no code change), selected with
# --model kev-4b: the overlay's stateful Qwen3.5 text decoder on the merged weights, no vocabulary head, the final-norm
# hidden state at every position of a static 128-token call, each Gated DeltaNet layer's recurrence in the overlay's
# fp32 Metal chunk kernel. The pointer head runs on the host. conversion/kev/README.md lists the oracle, the merge and
# the gates in order.

["kev-4b"]
script = "kev/export_decoder.py"
args = ["fp16", "--model", "kev-4b", "--prefill-chunk", "128", "--gdn-scan", "metal", "--aot"]
card = "README.md"
hf_repo = "mlboydaisuke/Kev-4B-CoreAI"
source_hf_id = "jaredpalmer/kev-4b"
source_revision = "6cfce5c2fa4b4bd64026336ab649c5ca78857d52"
base = "Qwen/Qwen3.5-4B-Base"
base_revision = "1001bb4d826a52d1f399e183466143f4da7b741b"
bundle = "gpu-pipelined/kev_4b_decode_fp16_metal_pf128"
status = "verified"
overlay = true
runtime_patches = []
needs = [
  "The author's repository at tag kev-1.0 (github.com/jaredpalmer/kev, commit 6b719c3c3f367295f6ef336f4f751cf5ff970abc) in",
  "$ZOO_WORK_ROOT/_kev/kev-src and its own environment (uv export --frozen of its uv.lock) for the merge;",
  "HF_HOME=$ZOO_WORK_ROOT/_kev/hf with jaredpalmer/kev-4b at tag v1.0 (591dcb5bd6d05eb0b5131ea6608f93f10243335c) and",
  "Qwen/Qwen3.5-4B-Base at 1001bb4d fetched once online by that venv.",
  "The merged checkpoint: (cd $ZOO_WORK_ROOT/_kev/kev-src && HF_HUB_OFFLINE=1 python scripts/merge_lora_checkpoint.py",
  "--lora jaredpalmer/kev-4b@591dcb5bd6d05eb0b5131ea6608f93f10243335c --out $ZOO_WORK_ROOT/_kev/merged/kev-4b-v1.0) (fp32,",
  "four shards, 16.8 GB), then the local id the exporter reads:",
  "$ZOO_WORK_ROOT/_kev/hf/hub/models--kev-local--kev-4b-v1.0-merged/snapshots/904380cbf0be/ with symlinks to the merged",
  "config.json, model.safetensors.index.json and the four shards, and refs/main = 904380cbf0be. The exporter checks the four",
  "shards' sha256 before it exports.",
  "The overlay venv (coreai-core 1.0.0b2, coreai-torch 0.4.1, torch 2.9.0, transformers 4.57.6), HF_HUB_OFFLINE=1, and for",
  "--aot Xcode 27.0 RC as DEVELOPER_DIR.",
]
aot = "xcrun coreai-build compile <name>.aimodel --output <dir> --platform macOS --preferred-compute gpu --architecture h16c --expect-frequent-reshapes"
notes = [
