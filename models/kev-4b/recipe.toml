  "record <work>/_kev/results/r12_ship_bundle_pf128_4b.json): export_decoder.py fp16 --model kev-4b --gdn-scan metal",
  "--prefill-chunk 128 --metadata-only --from-aimodel $ZOO_WORK_ROOT/_kev/exports/bundles/kev_4b_decode_fp16_metal_pf128/",
  "kev_4b_decode_fp16_metal_pf128.aimodel --bundle-dir $ZOO_WORK_ROOT/_kev/exports/ship/kev_4b_decode_fp16_metal_pf128",
  "(APFS clone; the .aimodel's files keep their sha256, the metadata differs from the export's in compilation.date only).",
  "One function, main, at a static 128 tokens; inputs input_ids [1, 128] int32 and position_ids [1, seq] int32, four fp16",
