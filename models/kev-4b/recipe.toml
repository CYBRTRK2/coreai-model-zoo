  "<work>/_kev/results/r12_export_fp16_metal_pf128_4b.json (a log; it does not change the bundle). Export 35.9 s (total",
  "45.1 s); --aot adds bundles_aotc/<name>.h16c.aimodelc (15,552,786,962 B, AOT 42.3 s), which the Python gates load and",
  "which is not shipped. Output: $ZOO_WORK_ROOT/_kev/exports/bundles/<name>/ (.aimodel, metadata.json, tokenizer/, head/).",
